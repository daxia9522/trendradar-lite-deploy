name: Get Hot News

on:
  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Stale queue guard
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_MINUTES: "30"
        run: |
          set -euo pipefail

          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            echo "re-run attempt ${GITHUB_RUN_ATTEMPT}; proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          created=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at 2>/dev/null || echo "")
          if [ -z "$created" ]; then
            echo "::warning::cannot read run created_at; proceeding (fail-open)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          age=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
          echo "queue wait: ${age}s (threshold: ${STALE_MINUTES}min)"
          if [ "$age" -gt "$(( STALE_MINUTES * 60 ))" ]; then
            echo "::warning::stale queued run; skipping crawl/email"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  crawl:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: success()
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      - name: Run crawler
        if: success()
        env:
          # 邮件
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          # AI（LiteLLM；AI_API_BASE 可指向 OpenAI-compatible 中转站）
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # 可选：覆盖 config.yaml ai.fallback_models；未设则用 yaml
          AI_FALLBACK_MODELS: ${{ secrets.AI_FALLBACK_MODELS }}
          AI_TIMEOUT: ${{ secrets.AI_TIMEOUT }}
          # 远程存储 R2/S3
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          # NewsNow：Secret 可覆盖 config；未设置则用 config.yaml 主源+fallback
          PLATFORMS_API_URL: ${{ secrets.PLATFORMS_API_URL }}
          PLATFORMS_API_FALLBACK_URLS: ${{ secrets.PLATFORMS_API_FALLBACK_URLS }}
          GITHUB_ACTIONS: true
          STORAGE_BACKEND: remote
          TZ: Asia/Shanghai
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
        run: python -m trendradar
