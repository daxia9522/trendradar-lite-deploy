name: Get Hot News

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crawl:
    if: vars.ACTIONS_DEPLOYMENT_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: success()
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      - name: Run crawler
        if: success()
        env:
          # 邮件
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          # AI（LiteLLM；AI_API_BASE 可指向 OpenAI-compatible 中转站）
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # 可选：覆盖 config.yaml ai.fallback_models；未设则用 yaml
          AI_FALLBACK_MODELS: ${{ secrets.AI_FALLBACK_MODELS }}
          # 远程存储 R2/S3
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          # NewsNow：Secret 可覆盖 config；未设置则用 config.yaml 主源+fallback
          PLATFORMS_API_URL: ${{ secrets.PLATFORMS_API_URL }}
          PLATFORMS_API_FALLBACK_URLS: ${{ secrets.PLATFORMS_API_FALLBACK_URLS }}
          GITHUB_ACTIONS: true
          STORAGE_BACKEND: remote
          TZ: Asia/Shanghai
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
        run: python -m trendradar
