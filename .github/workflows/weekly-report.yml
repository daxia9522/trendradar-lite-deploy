name: Weekly AI Report

on:
  workflow_dispatch:

concurrency:
  group: weekly-report-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Stale queue guard
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_MINUTES: "360"
        run: |
          set -euo pipefail

          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            echo "re-run attempt ${GITHUB_RUN_ATTEMPT}; proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          created=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at 2>/dev/null || echo "")
          if [ -z "$created" ]; then
            echo "::warning::cannot read run created_at; proceeding (fail-open)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          age=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
          echo "queue wait: ${age}s (threshold: ${STALE_MINUTES}min)"
          if [ "$age" -gt "$(( STALE_MINUTES * 60 ))" ]; then
            echo "::warning::stale queued run; skipping weekly report/email"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  weekly-report:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Pull last 7 days data from R2
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          PULL_DAYS: "7"
        run: python deploy/actions/pull_remote_data.py

      - name: Generate weekly report and send email
        env:
          # 与日报共用同名 Secrets；按备用槽位绑定模型、地址和 Key
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # 模型用英文逗号分隔；未设/空值沿用 config.yaml ai.fallback_models
          AI_FALLBACK_MODELS: ${{ secrets.AI_FALLBACK_MODELS }}
          # URL/Key 用 @ 分隔并保留空位；直接 env 注入，不经过 shell 拼接
          AI_FALLBACK_API_BASE: ${{ secrets.AI_FALLBACK_API_BASE }}
          AI_FALLBACK_API_KEY: ${{ secrets.AI_FALLBACK_API_KEY }}
          # 未设置/空值沿用 config.yaml；当前默认 120 秒
          AI_TIMEOUT: ${{ secrets.AI_TIMEOUT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
        run: python weekly_report/weekly_ai_report_email.py
