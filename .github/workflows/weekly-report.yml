name: Weekly AI Report

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC: Sunday 04:30 UTC = 12:30 Asia/Shanghai.
    - cron: "30 4 * * 0"

concurrency:
  group: weekly-report-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Stale queue guard
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_MINUTES: "360"
        run: |
          set -euo pipefail

          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            echo "re-run attempt ${GITHUB_RUN_ATTEMPT}; proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          created=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at 2>/dev/null || echo "")
          if [ -z "$created" ]; then
            echo "::warning::cannot read run created_at; proceeding (fail-open)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          age=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
          echo "queue wait: ${age}s (threshold: ${STALE_MINUTES}min)"
          if [ "$age" -gt "$(( STALE_MINUTES * 60 ))" ]; then
            echo "::warning::stale queued run; skipping weekly report/email"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  weekly-report:
    needs: guard
    if: (vars.ACTIONS_DEPLOYMENT_ENABLED == 'true' || github.event_name == 'workflow_dispatch') && needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull last 7 days data from R2
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          PULL_DAYS: "7"
        run: python deploy/actions/pull_remote_data.py

      - name: Generate weekly report and send email
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_FALLBACK_MODELS: ${{ secrets.AI_FALLBACK_MODELS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
        run: python weekly_report/weekly_ai_report_email.py
