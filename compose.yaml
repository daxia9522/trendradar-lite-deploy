services:
  setup:
    profiles: ["setup"]
    build:
      context: .
    image: trendradar-lite-deploy:local
    user: "0:0"
    entrypoint:
      - python
      - deploy/configure.py
      - --output
      - /setup/.env
      - --host
      - 0.0.0.0
    ports:
      - "127.0.0.1:${SETUP_PORT:-8765}:8765"
    volumes:
      - ./.env:/setup/.env

  trendradar:
    build:
      context: .
    image: trendradar-lite-deploy:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOCKER_CONTAINER: "true"
      STORAGE_BACKEND: "local"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./config:/app/config:ro
      - trendradar-output:/app/output

volumes:
  trendradar-output:
