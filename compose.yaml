services:
  setup:
    profiles: ["setup"]
    # v26.10 OCI index (linux/amd64 + linux/arm64), verified against GHCR.
    image: ${TREND_RADAR_IMAGE:-ghcr.io/daxia9522/trendradar-lite-deploy:v26.10@sha256:b8ef73d28828c5d6e4cad8970b4ac2fc1c881617114430525903422307ec8e83}
    pull_policy: missing
    user: "0:0"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Atomic saves/backups keep host UID/GID and private 700/600 permissions.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    entrypoint:
      - python
      - deploy/configure.py
      - --runtime-config
      - --output
      - /setup/runtime/env
      - --host
      - 0.0.0.0
      - --public-port
      - "${SETUP_PORT:-8765}"
      - --ssh-user
      - "${SETUP_SSH_USER:-}"
      - --ssh-host
      - "${SETUP_SSH_HOST:-}"
      - --ssh-port
      - "${SETUP_SSH_PORT:-0}"
      - --deployment
      - docker
    ports:
      - "127.0.0.1:${SETUP_PORT:-8765}:8765"
    volumes:
      # Mount the directory so setup can atomically replace runtime/env and retain private backups.
      - .:/setup

  volume-init:
    profiles: ["setup"]
    image: ${TREND_RADAR_IMAGE:-ghcr.io/daxia9522/trendradar-lite-deploy:v26.10@sha256:b8ef73d28828c5d6e4cad8970b4ac2fc1c881617114430525903422307ec8e83}
    pull_policy: missing
    user: "0:0"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Traverse private pre-existing output directories, then change ownership.
    cap_add: ["CHOWN", "DAC_READ_SEARCH"]
    network_mode: none
    entrypoint: ["python", "deploy/docker/manage.py", "init-volume"]
    volumes:
      # Only explicit installation/update can initialize data-volume ownership.
      - trendradar-output:/app/output

  trendradar:
    build:
      context: .
    image: ${TREND_RADAR_IMAGE:-ghcr.io/daxia9522/trendradar-lite-deploy:v26.10@sha256:b8ef73d28828c5d6e4cad8970b4ac2fc1c881617114430525903422307ec8e83}
    pull_policy: missing
    restart: unless-stopped
    user: "${TRENDRADAR_UID:-1000}:${TRENDRADAR_GID:-1000}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      DOCKER_CONTAINER: "true"
      STORAGE_BACKEND: "local"
      TRENDRADAR_RUNTIME_ENV: /app/runtime/env
      HOME: /tmp
    volumes:
      - ./config:/app/config:ro
      # Mount the directory, not the file: atomic saves replace the env inode.
      - ./runtime:/app/runtime:ro
      - trendradar-output:/app/output

volumes:
  trendradar-output:
