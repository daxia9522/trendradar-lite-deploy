services:
  trendradar:
    build:
      context: .
    image: trendradar-lite-deploy:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOCKER_CONTAINER: "true"
      STORAGE_BACKEND: "local"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./config:/app/config:ro
      - trendradar-output:/app/output

volumes:
  trendradar-output:
