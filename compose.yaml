services:
  setup:
    profiles: ["setup"]
    build:
      context: .
    image: ${TREND_RADAR_IMAGE:-ghcr.io/daxia9522/trendradar-lite-deploy:latest}
    pull_policy: missing
    user: "0:0"
    entrypoint:
      - python
      - deploy/configure.py
      - --output
      - /setup/.env
      - --host
      - 0.0.0.0
      - --public-port
      - "${SETUP_PORT:-8765}"
      - --ssh-user
      - "${SETUP_SSH_USER:-}"
      - --ssh-host
      - "${SETUP_SSH_HOST:-}"
      - --ssh-port
      - "${SETUP_SSH_PORT:-0}"
      - --deployment
      - docker
    ports:
      - "127.0.0.1:${SETUP_PORT:-8765}:8765"
    volumes:
      - ./.env:/setup/.env

  trendradar:
    build:
      context: .
    image: ${TREND_RADAR_IMAGE:-ghcr.io/daxia9522/trendradar-lite-deploy:latest}
    pull_policy: missing
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOCKER_CONTAINER: "true"
      STORAGE_BACKEND: "local"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./config:/app/config:ro
      - trendradar-output:/app/output

volumes:
  trendradar-output:
