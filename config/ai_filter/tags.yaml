# 六栏分类与展示限额。
interests: |
  选取有明确新闻事件或公共信息价值的标题，按事件的主要事实归入一个栏目。
  保留政策利率调整、重要经济数据发布、财报和重大市场异动；基点、预期、前值或数字模板本身不构成排除理由。
  排除无事件增量的常规行情报价、开收盘点位和招标流水；仅在标题显示异常或重要变化线索、但是否为常规流水暂无法确认时保留。这一保留原则不适用于无明确事实的模糊热搜、口号或闲聊。
  先判断事件性质，再判断地点、人物或公司名；不要用零散字词或名字子串猜栏目。
  财报、融资、经营和市场价格优先财经；技术研究和产品功能优先科技；
  影视文化作品优先文娱；竞技比赛优先体育；上述专业主题不因发生在国外改为国际。
  国内/国际用于政治、外交、社会、民生和公共安全等综合事务；中国对外外交属于国际。
  明确国外公共事务不能因出现“法院、学校、居民”等通用词划入国内。
  没有足够事实判断类别的模糊热搜、纯情绪口号、广告或无新闻事件的闲聊不输出。
  只依据标题，不臆造背景；中英文标题同等处理。公司名、艺人名或体育队名只作语境，
  人物跨界任职、诉讼、事故等应看本次事件，而不是按其原职业固定归类。
tags:
  - id: 1
    name: 国内新闻
    max_count: 20
    description: >-
      中国境内的公共治理、社会民生、教育医疗、法治、公共安全、灾害天气和公共服务。
      不作为其他栏目无法判断时的兜底。明确国外事件、对外外交和冲突不归此栏；
      不因出现中国城市、机构或企业名称就覆盖本来明确的科技、财经、文娱、体育主题。
  - id: 2
    name: 国际新闻
    max_count: 20
    description: >-
      国外政治社会、国际关系、外交、国际组织、战争冲突和跨国公共安全，含中国对外外交。
      国外企业技术产品、财报、赛事和影视作品分别归科技、财经、体育、文娱；
      商品的外国品牌或产地本身不构成国际新闻。经济政策和经贸措施以经济事实为主时归财经。
  - id: 3
    name: 科技新闻
    max_count: 15
    description: >-
      科学发现，以及人工智能、芯片、机器人、航天、能源技术、生物技术和软硬件产品的研发、发布、功能与安全漏洞。
      公司财报、融资、销量、经营治理归财经；以AI或某产品为工具的社会法治事件不自动算科技。
      仅出现“宇宙、智能、芯片”等比喻或名字片段而无科技事件，不归此栏。
  - id: 4
    name: 财经新闻
    max_count: 15
    description: >-
      宏观经济、金融市场、财政货币政策、关税经贸、商业经营、财报、融资并购、公司治理、
      房地产和大宗商品。按本次经济/经营事实判断，不因科技企业名称把财报变成科技，
      也不因新闻附带一个价格或票房数字就覆盖主要的技术发布或影视作品主题。
  - id: 5
    name: 文娱新闻
    max_count: 10
    description: >-
      影视、音乐、综艺、文学艺术、文化遗产、游戏作品及娱乐行业人物的相关事件。
      电竞竞技赛事归体育；涉及艺人的明确公共政策或跨界政治任职按事件归国内/国际。
      不凭“游戏、演员”等无关比喻、名字子串分类。
  - id: 6
    name: 体育新闻
    max_count: 10
    description: >-
      体育和电竞比赛、成绩、训练、球队转会及体育组织/运动员的相关体育事件。
      体育人物的政治任职、外交活动或以影视作品为主题的报道不归此栏。
      球队简称必须确实指球队，不将其他地名或词语中的相同子串视为体育。
