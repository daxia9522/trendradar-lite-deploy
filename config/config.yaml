# Rebuilt on 2026-04-01 after host bind-mount config directory was missing
app:
  timezone: Asia/Shanghai

platforms:
  enabled: true
  # 主源：自建 NewsNow（Cloudflare Pages）
  # 也可用环境变量 PLATFORMS_API_URL 覆盖
  api_url: "https://daynews.pages.dev/api/s"
  # 主源超时/失败后按序 fallback；也可用 PLATFORMS_API_FALLBACK_URLS（逗号分隔）
  api_fallback_urls:
    - "https://newsnow.busiyi.world/api/s"
  sources:
    - id: baidu
      name: 百度热搜
      expected_domain: baidu.com
    - id: thepaper
      name: 澎湃新闻
      expected_domain: thepaper.cn
    - id: ifeng
      name: 凤凰网
      expected_domain: ifeng.com
    - id: cankaoxiaoxi
      name: 参考消息
    - id: zaobao
      name: 联合早报
    - id: wallstreetcn-hot
      name: 华尔街见闻 最热
      expected_domain: wallstreetcn.com
    - id: wallstreetcn-quick
      name: 华尔街见闻 快讯
      expected_domain: wallstreetcn.com
    - id: cls-hot
      name: 财联社热门
      expected_domain: cls.cn
    - id: weibo
      name: 微博
      expected_domain: weibo.com
    - id: douyin
      name: 抖音
      expected_domain: douyin.com
    - id: zhihu
      name: 知乎
      expected_domain: zhihu.com
    - id: sputniknewscn
      name: 卫星通讯社
      expected_domain: sputniknews.cn
    - id: kaopu
      name: 靠谱新闻
      expected_domain: kaopu.news

report:
  mode: current
  display_mode: keyword
  rank_threshold: 10
  sort_by_position_first: false
  max_news_per_keyword: 0

notification:
  enabled: true

schedule:
  enabled: true
  preset: custom

rss:
  enabled: false
  freshness_filter:
    enabled: true
    max_age_days: 3
  feeds: []

# Named connection groups. Production endpoint; credentials remain in the private environment file.
model_groups:
  gemini_official:
    api_key_env: GEMINI_API_KEY
    # 不填写 api_base，使用 LiteLLM 的 Gemini 官方默认路由。
    models:
      g4_hydrogen: gemini/gemini-4-hydrogen
      g35_lite: gemini/gemini-3.5-flash-lite
      g31_lite: gemini/gemini-3.1-flash-lite

  cf:
    api_base_env: CF_API_BASE
    api_key_env: CF_API_KEY
    models:
      qwen_cf: openai/@cf/qwen/qwen3.8-27b

tasks:
  ai_filter:
    timeout: 120
    retry:
      attempts_per_model: 2
      delay_seconds: 5
    model_chain:
      - model_id: g35_lite
      - model_id: g31_lite

  daily_analysis:
    timeout: 120
    retry:
      normal_retries: 2
      congestion_delays: [5, 8]
      timeout_retries: 0
    model_chain:
      - model_id: g4_hydrogen
        request_params:
          reasoning_effort: low
      - model_id: g35_lite
        request_params:
          reasoning_effort: low
      - model_id: qwen_cf
        request_params:
          extra_body:
            chat_template_kwargs:
              enable_thinking: false

  weekly_analysis:
    timeout: 120
    retry:
      normal_retries: 2
      congestion_delays: [5, 8]
      timeout_retries: 0
    model_chain:
      - model_id: g4_hydrogen
        request_params:
          reasoning_effort: low
      - model_id: g35_lite
        request_params:
          reasoning_effort: low
      - model_id: qwen_cf
        request_params:
          extra_body:
            chat_template_kwargs:
              enable_thinking: false

  weekly_keywords:
    timeout: 120
    retry:
      normal_retries: 1
      congestion_delays: [5, 8]
      timeout_retries: 0
    model_chain:
      - model_id: g35_lite

# 独立六栏筛选；模型配置见 tasks.ai_filter。
ai_filter:
  enabled: false
  min_score: 0.7

ai_analysis:
  enabled: false
  language: Chinese
  prompt_file: ai_analysis_prompt.txt
  include_rank_timeline: true
storage:
  backend: auto
  formats:
    sqlite: true
    txt: true
    html: true
  local:
    data_dir: output
    retention_days: 0
  pull:
    enabled: false
    days: 7

display:
  region_order:
    - new_items
    - ai_analysis
    - hotlist
    - rss
    - standalone
  regions:
    hotlist: true
    rss: true
    new_items: true
    standalone: true
    ai_analysis: true
  # 新增展示限额；0表示不限量。
  new_items:
    max_items: 40
    max_per_source: 5
  standalone:
    platforms: ["weibo", "zhihu"]
    rss_feeds: []
    max_items: 20

advanced:
  debug: false
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: ""
  rss:
    request_interval: 2000
    timeout: 15
    use_proxy: false
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
